buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:2.1.6.RELEASE")
    }
}

apply plugin: 'java'
//apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'distribution'


bootJar {
    baseName = 'java-spring-vuly'
    version =  '0.1.0'
}

repositories {
    mavenCentral()
}

sourceCompatibility = 11
targetCompatibility = 11

dependencies {

    implementation("org.springframework.boot:spring-boot-starter-web")
    compileOnly("org.springframework.boot:spring-boot-devtools")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    implementation("org.thymeleaf.extras:thymeleaf-extras-springsecurity5")
    implementation("com.h2database:h2")
    runtimeOnly("org.postgresql:postgresql")
    implementation("io.jsonwebtoken:jjwt-api:0.10.7")
    implementation("org.apache.logging.log4j:log4j-slf4j-impl:2.14.1")

    implementation("org.springdoc:springdoc-openapi-ui:1.2.32")

    testCompileOnly("junit:junit")

    implementation("io.jsonwebtoken:jjwt-impl:0.10.7")
    implementation("io.jsonwebtoken:jjwt-jackson:0.10.7")

    compileOnly("org.projectlombok:lombok:1.18.10")
    annotationProcessor("org.projectlombok:lombok:1.18.22")

    // Version constraints for vulnerable dependencies
    constraints {
        implementation("com.fasterxml.jackson.core:jackson-databind:2.12.6.1")
        implementation("org.apache.logging.log4j:log4j-core:2.17.1")
        implementation("org.springframework:spring-core:6.1.14")
        implementation("org.springframework:spring-webmvc:6.1.14")
        implementation("org.springframework:spring-web:6.1.14")
        implementation("org.springframework:spring-beans:6.1.14")
        implementation("org.springframework:spring-expression:6.1.14")
        implementation("org.springframework:spring-context:6.1.14")
        implementation("org.yaml:snakeyaml:2.0")
        implementation("com.fasterxml.jackson.core:jackson-core:2.18.6")
        implementation("org.springframework.boot:spring-boot:3.3.11")
        implementation("org.apache.commons:commons-lang3:3.18.0")
        implementation("org.webjars:swagger-ui:4.1.3")
    }
}

configurations.implementation {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

